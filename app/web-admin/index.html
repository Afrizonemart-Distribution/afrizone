<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AfriZone PartTime Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin: 0">
    <div id="root">
      <!-- Static boot splash: replaced by React on mount (no white flash).
           The fixed, inset:0 div below already paints navy edge-to-edge for
           this boot phase - body itself has no background of its own (it
           picks up global.css's --bg), so nothing leaks through once React
           replaces this markup. An earlier version set the navy on <body>
           too; as an inline style it beat every CSS rule permanently,
           including on pages whose content doesn't fill the viewport. -->
      <div style="position: fixed; inset: 0; display: grid; place-items: center; background: #000066; font-family: 'Raleway', sans-serif">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 26px">
          <div style="position: relative; padding-bottom: 18px">
            <!-- Same assets as src/components/Logo.tsx, referenced rather than
                 duplicated: this markup paints before any JS loads, so it
                 cannot import the component. It is the overlap lockup at
                 Splash.tsx's size 60, so nothing jumps when React takes over:
                 60x63 is 60 / (107/113), and -41px is -(11 + 60 * 0.5). -->
            <div style="display: flex; align-items: center; gap: 11px">
              <img src="/logo-mark.png"
                   srcset="/logo-mark-76.png 76w, /logo-mark-92.png 92w, /logo-mark.png 107w"
                   sizes="60px" width="60" height="63" alt="" />
              <span style="position: relative; margin-left: -41px; font-weight: 800; font-style: italic; font-size: 19px; letter-spacing: -.02em; color: #fff; white-space: nowrap">AfriZoneMart.com</span>
            </div>
            <span style="position: absolute; top: 63px; left: 50%; transform: translateX(-50%); margin-top: 4px; font-size: 11px; font-style: italic; color: #a6a5bd; white-space: nowrap">Made in Africa, delivered worldwide</span>
          </div>
          <div style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #fbac34; animation: azspin .8s linear infinite"></div>
        </div>
      </div>
      <style>@keyframes azspin { to { transform: rotate(360deg) } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
